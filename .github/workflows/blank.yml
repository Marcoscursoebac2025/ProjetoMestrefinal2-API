name: Cypress API Tests

on: [push, pull_request]

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
     run: npm install
     run: npx start-server-and-test "npm start" http://localhost:3000/api "npx cypress run"
