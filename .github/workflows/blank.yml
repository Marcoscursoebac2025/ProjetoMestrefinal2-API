name: usuarios-api-CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Checkout del repo de pruebas
      - name: Checkout projetomestrefinal2-api
        uses: actions/checkout@v3
        with:
          path: projetomestrefinal2-api

      # Checkout del repo del servidor
      - name: Checkout hub-de-leitura-api
        uses: actions/checkout@v3
        with:
          repository: fabioaraujoqa/hub-de-leitura-api
          path: hub-de-leitura-api

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      # Verificar estructura del servidor
      - name: Listar archivos del servidor
        run: ls -R
        working-directory: hub-de-leitura-api

      # Instalar dependencias del servidor (ajusta la carpeta según el resultado del ls)
      - name: Instalar dependências do servidor
        run: npm install
        working-directory: hub-de-leitura-api

      # Instalar dependencias de pruebas
      - name: Instalar dependências das provas
        run: npm install
        working-directory: projetomestrefinal2-api

      - name: Iniciar servidor principal
        run: |
          nohup node src/server.js & sleep 5
        working-directory: hub-de-leitura-api

      - name: Rodar testes E2E
        run: npm run test:e2e
        working-directory: projetomestrefinal2-api
        env:
          PORT: 3000

